<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tonchi</title>
<style>
  :root {
    --thread: #e03127;
    --ink: #1f1f1f;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
  #threads {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  /* Everything that is part of the picture lives in here, so one scale
     zooms the whole scene. The threads are drawn on the canvas at full
     device resolution instead, which keeps them crisp when zoomed. */
  #world {
    position: absolute; inset: 0;
    /* Zoom pivots on the bottom edge, so the girl never lifts off the
       floor of the page however far you pull back. */
    transform-origin: 50% 100%;
    will-change: transform;
    z-index: 2;
  }
  #girlLink {
    position: absolute;
    z-index: 2;
    right: 23vw;
    bottom: 0;
    display: block;
    line-height: 0;
    cursor: pointer;
  }
  #girl {
    user-select: none;
    -webkit-user-drag: none;
    height: min(42vh, 405px);
    width: auto;
    display: block;
    transition: filter .2s ease;
  }
  #girlLink:hover #girl { filter: brightness(1.04); }
  #girlLink:focus-visible #girl { outline: 2px solid var(--thread); outline-offset: 4px; }
  .card {
    position: absolute;
    left: 0; top: 0;
    margin: 0;
    z-index: 3;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
  }
  .card.dragging { cursor: grabbing; }
  .card a { display: block; color: inherit; text-decoration: none; outline: none; }
  .card a:focus-visible img { outline: 2px solid var(--thread); outline-offset: 3px; }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    pointer-events: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.07), 0 5px 16px rgba(0,0,0,.09);
    transition: box-shadow .3s ease;
  }
  .card.dragging img { box-shadow: 0 2px 5px rgba(0,0,0,.10), 0 18px 36px rgba(0,0,0,.20); }
  .card figcaption {
    margin: .4em 0 0;
    font-size: clamp(9.5px, .72vw, 12px);
    line-height: 1.32;
    letter-spacing: .005em;
    color: #3a3a3a;
  }

  #controls {
    position: fixed;
    left: 18px; bottom: 18px;
    z-index: 10;
    display: flex;
    gap: 7px;
  }
  #controls button {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    padding: 0;
    border: 1px solid rgba(0,0,0,.13);
    border-radius: 50%;
    background: rgba(255,255,255,.9);
    color: #444;
    font: 500 15px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
    cursor: pointer;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }
  #controls button:hover:not(:disabled) { background: #fff; color: var(--thread); border-color: rgba(224,49,39,.4); }
  #controls button:disabled { opacity: .32; cursor: default; }
  #controls button:focus-visible { outline: 2px solid var(--thread); outline-offset: 2px; }
  #controls svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 860px) {
    #girlLink { right: 50%; transform: translateX(50%); }
    #girl { height: 34vh; }
    .card figcaption { font-size: 9.5px; line-height: 1.28; }
    #controls { left: 12px; bottom: 12px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="threads"></canvas>
  <div id="world">
    <a id="girlLink" href="https://es.wikipedia.org/wiki/Trinidad_Matta" target="_blank" rel="noopener noreferrer">
      <img id="girl" src="girl.png" alt="Trinidad Matta" draggable="false">
    </a>
  </div>
</div>

<div id="controls">
  <button id="zoomOut" type="button" aria-label="Alejar" title="Alejar">&minus;</button>
  <button id="zoomIn" type="button" aria-label="Acercar" title="Acercar">+</button>
  <button id="reset" type="button" aria-label="Volver a ordenar" title="Volver a ordenar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.4h-4.4"/></svg>
  </button>
</div>

<script>
(() => {
  // ---------------------------------------------------------------- data
  // ar = image aspect ratio (w/h). w = card width as a fraction of the
  // viewport width. strand = which traced line the picture hangs off, which
  // is also what puts it where it sits.
  const ITEMS = [
    { text: 'Soberana Orden Militar de Malta.', href: 'https://es.wikipedia.org/wiki/Orden_de_Malta',
      src: 'img/2001.jpg', ar: 900/600,
      strand: 2, wide: { w: 0.146 }, narrow: { w: 0.280, x: 0.180, row: 0 } },

    { text: 'Caso de las salchichas (1522).', href: 'https://es.wikipedia.org/wiki/Caso_de_las_salchichas',
      src: 'img/2003.jpg', ar: 900/675,
      strand: 4, wide: { w: 0.118 }, narrow: { w: 0.260, x: 0.500, row: 0 } },

    { text: 'Architecture terrible.', href: 'https://en.wikipedia.org/wiki/Architecture_terrible',
      src: 'img/2006.jpg', ar: 900/600,
      strand: 5, wide: { w: 0.142 }, narrow: { w: 0.280, x: 0.820, row: 0 } },

    { text: 'Hegéloco.', href: 'https://es.wikipedia.org/wiki/Heg%C3%A9loco',
      src: 'img/2011.jpg', ar: 890/900,
      strand: 8, wide: { w: 0.096 }, narrow: { w: 0.240, x: 0.165, row: 1 } },

    { text: 'Large numbers.', href: 'https://en.wikipedia.org/wiki/Large_numbers',
      src: 'img/2015.jpg', ar: 900/854,
      strand: 1, wide: { w: 0.116 }, narrow: { w: 0.250, x: 0.500, row: 1 } },

    { text: 'Criterion of embarrassment.', href: 'https://en.wikipedia.org/wiki/Criterion_of_embarrassment',
      src: 'img/2020.jpg', ar: 733/900,
      strand: 3, wide: { w: 0.100 }, narrow: { w: 0.220, x: 0.430, row: 2 } },

    { text: 'Tablilla de quejas a Ea-nasir.', href: 'https://es.wikipedia.org/wiki/Tablilla_de_Ea-nasir',
      src: 'img/2024.jpg', ar: 511/900,
      strand: 0, wide: { w: 0.072 }, narrow: { w: 0.160, x: 0.115, row: 2 } },

    { text: 'Unst Bus Shelter.', href: 'https://en.wikipedia.org/wiki/Unst_Bus_Shelter',
      src: 'img/2026.jpg', ar: 900/607,
      strand: 9, wide: { w: 0.130 }, narrow: { w: 0.230, x: 0.300, row: 3 } },

    { text: 'Papa Benedicto IX.', href: 'https://es.wikipedia.org/wiki/Benedicto_IX',
      src: 'img/2028.jpg', ar: 1,
      strand: 10, wide: { w: 0.114 }, narrow: { w: 0.240, x: 0.785, row: 2 } },

    { text: 'Osama bin Laden', href: 'https://es.wikipedia.org/wiki/Osama_bin_Laden_(elefante)',
      src: 'img/2030.jpg', ar: 900/700,
      strand: 6, wide: { w: 0.104 }, narrow: { w: 0.260, x: 0.835, row: 1 } },

    { text: 'Incidente de Đorđe Martinović', href: 'https://es.wikipedia.org/wiki/Incidente_de_Đorđe_Martinović',
      src: 'img/2032.jpg', ar: 428/731,
      strand: 7, wide: { w: 0.090 }, narrow: { w: 0.190, x: 0.700, row: 3 } },
  ];

  // Where the threads are knotted, as a fraction of girl.png: a point a
  // little behind her head, so every thread comes out from behind her hair.
  const HEAD = { x: 232 / 385, y: 0.11 };

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const THREAD = getComputedStyle(document.documentElement).getPropertyValue('--thread').trim() || '#e03127';

  // ---------------------------------------------------------------- dom
  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const canvas = document.getElementById('threads');
  const ctx = canvas.getContext('2d');
  const girl = document.getElementById('girl');
  const controls = document.getElementById('controls');

  let W = 0, H = 0, DPR = 1, narrow = false;
  let head = { x: 0, y: 0 };
  let girlBox = { x0: 0, x1: 0, y0: 0, y1: 0 };   // where she stands, world px
  let topZ = 10;

  // ---------------------------------------------------------------- zoom
  // Card and thread coordinates are world coordinates: the layout as it
  // would sit at zoom 1. Zoom scales the scene about the bottom edge of
  // the screen, so the girl stays planted on the floor of the page and
  // pulling back opens room above and beside her.
  const MIN_ZOOM = 0.45, MAX_ZOOM = 1;
  let zoom = 1;

  const toWorldX = sx => (sx - W / 2) / zoom + W / 2;
  const toWorldY = sy => (sy - H) / zoom + H;

  function applyZoom() {
    world.style.transform = 'scale(' + zoom + ')';
    document.getElementById('zoomOut').disabled = zoom <= MIN_ZOOM + 1e-4;
    document.getElementById('zoomIn').disabled = zoom >= MAX_ZOOM - 1e-4;
  }

  function setZoom(z) {
    const next = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, z));
    if (Math.abs(next - zoom) < 1e-4) return;
    zoom = next;
    applyZoom();
    // pulling back gives more room, pushing in takes it away
    for (const c of cards) {
      if (c.dragging || c.settleAt) continue;
      const b = bounds(c);
      c.tx = Math.min(Math.max(c.tx, b.minX), b.maxX);
      c.ty = Math.min(Math.max(c.ty, b.minY), b.maxY);
      c.homeX = c.tx; c.homeY = c.ty;
    }
  }

  const cards = ITEMS.map((item, i) => {
    const fig = document.createElement('figure');
    fig.className = 'card';
    fig.innerHTML =
      '<a href="' + item.href + '" target="_blank" rel="noopener noreferrer" draggable="false">' +
        '<img src="' + item.src + '" alt="' + item.text + '" draggable="false" ' +
             'style="aspect-ratio:' + item.ar + '">' +
        '<figcaption>' + item.text + '</figcaption>' +
      '</a>';
    world.appendChild(fig);
    return {
      item, i, el: fig, link: fig.querySelector('a'),
      x: 0, y: 0, vx: 0, vy: 0,      // centre and velocity, world px
      tx: 0, ty: 0,                   // spring target
      homeX: 0, homeY: 0,             // where the layout puts it
      rot: 0, sc: 1, w: 0, h: 0, ox: 0, oy: 0,
      phase: (i * 2.399) % (Math.PI * 2),
      dragging: false, pointerId: null,
      grabDX: 0, grabDY: 0,
      downX: 0, downY: 0, downT: 0, moved: false,
      fx: null, fy: null,             // position the visitor chose
      settleAt: 0,                    // when it is let go of the middle
      rope: null,
    };
  });

  // ------------------------------------------------------------- threads
  //
  // The threads are not invented. Each one is a strand traced out of the
  // "lines" vector in the Figma file: the artwork was skeletonised, the
  // eleven strands that meet at the knot were followed from their outer tip
  // inward, and each was smoothed into a single clean curve that leaves the
  // knot and arrives straight at its picture. STRANDS holds them as
  // polylines in the drawing's own units, measured from the knot, so the
  // picture the file describes is what the page draws before anything is
  // touched.
  const STRANDS = [
    [0,0,-39,5,-77,12,-116,15,-154,7,-191,-7,-228,-20,-265,-32,-303,-41,-342,-49,-380,-55,-419,-59,-458,-61,-498,-61,-537,-60,-576,-58,-615,-56,-654,-52,-693,-49,-732,-46,-771,-42,-810,-40,-849,-38,-888,-37,-927,-37,-966,-38,-1005,-39,-1044,-41,-1084,-45,-1122,-49,-1161,-54,-1200,-61,-1238,-68,-1276,-77,-1315,-85,-1353,-94,-1391,-102,-1430,-109,-1468,-114,-1507,-118,-1546,-122,-1585,-126,-1624,-130,-1663,-135],
    [0,0,-25,-9,-51,-17,-76,-26,-102,-34,-127,-44,-151,-55,-176,-66,-201,-76,-227,-84,-252,-92,-279,-98,-305,-104,-331,-108,-358,-112,-385,-115,-411,-118,-438,-120,-465,-121,-492,-122,-519,-123,-546,-124,-572,-124,-599,-125,-626,-125,-653,-126,-680,-126,-707,-127,-734,-129,-761,-130,-787,-133,-814,-136,-841,-139,-867,-143,-894,-148,-920,-154,-946,-161,-972,-169,-997,-178,-1022,-188,-1047,-197,-1072,-206,-1098,-216,-1123,-225],
    [0,0,-33,-24,-66,-46,-98,-71,-126,-99,-153,-128,-181,-158,-209,-186,-239,-213,-271,-238,-306,-258,-343,-271,-383,-274,-423,-268,-461,-256,-498,-241,-535,-224,-572,-207,-609,-192,-648,-183,-688,-183,-726,-194,-762,-213,-792,-239,-817,-271,-837,-305,-854,-342,-868,-380,-880,-418,-892,-456,-903,-495,-914,-534,-925,-572,-937,-610,-951,-648,-967,-685,-986,-720,-1009,-753,-1037,-782,-1068,-808,-1097,-836,-1126,-863,-1155,-891,-1184,-918],
    [0,0,-7,-13,-13,-26,-20,-40,-26,-53,-33,-66,-40,-80,-46,-93,-53,-106,-60,-119,-67,-132,-75,-144,-82,-157,-90,-170,-98,-182,-106,-195,-114,-208,-122,-220,-130,-232,-138,-244,-147,-257,-155,-269,-164,-281,-173,-293,-181,-304,-190,-316,-199,-328,-208,-340,-218,-351,-227,-363,-236,-374,-246,-386,-255,-397,-265,-408,-275,-419,-285,-430,-294,-441,-304,-452,-315,-463,-325,-474,-335,-485,-345,-495,-355,-506,-365,-517],
    [0,0,-11,-36,-22,-72,-32,-108,-42,-144,-52,-181,-60,-217,-67,-254,-74,-291,-80,-328,-86,-365,-91,-402,-96,-440,-102,-477,-109,-514,-117,-550,-126,-587,-138,-622,-153,-657,-171,-690,-194,-719,-223,-744,-256,-762,-291,-774,-328,-782,-365,-788,-402,-794,-439,-800,-476,-808,-512,-819,-547,-833,-580,-850,-610,-872,-637,-898,-661,-927,-682,-959,-700,-991,-717,-1025,-732,-1060,-746,-1094,-762,-1128,-776,-1163,-792,-1197,-806,-1232],
    [0,0,-1,-30,-1,-60,-1,-90,-3,-120,-8,-149,-15,-178,-21,-208,-26,-237,-30,-267,-33,-297,-35,-326,-37,-356,-38,-386,-38,-416,-38,-446,-37,-476,-36,-506,-34,-536,-33,-566,-31,-596,-29,-626,-27,-656,-26,-686,-24,-716,-23,-745,-22,-775,-21,-805,-21,-835,-21,-865,-22,-895,-24,-925,-26,-955,-30,-985,-34,-1014,-40,-1044,-47,-1073,-55,-1102,-65,-1130,-75,-1158,-85,-1186,-95,-1214,-105,-1243,-115,-1271],
    [0,0,6,-28,13,-56,20,-84,25,-113,26,-141,25,-170,23,-199,22,-228,21,-256,20,-285,19,-314,18,-343,18,-372,17,-400,17,-429,18,-458,18,-487,18,-516,19,-545,20,-573,22,-602,23,-631,25,-660,27,-688,29,-717,32,-746,35,-775,38,-803,41,-832,45,-860,49,-889,53,-918,58,-946,62,-974,67,-1003,73,-1031,78,-1059,84,-1088,91,-1116,97,-1144,103,-1172,109,-1200,115,-1228],
    [0,0,26,5,51,10,77,16,103,21,129,24,155,26,181,27,207,27,233,26,260,24,286,20,311,16,337,10,362,3,387,-4,412,-14,436,-24,459,-35,482,-48,504,-62,525,-78,545,-95,564,-113,582,-133,598,-153,612,-176,624,-198,634,-223,643,-247,649,-273,653,-299,655,-325,655,-351,652,-377,648,-403,642,-428,634,-453,624,-478,614,-502,604,-526,594,-550,584,-575,574,-599],
    [0,0,7,-3,14,-6,21,-9,28,-12,35,-15,42,-17,49,-20,56,-22,63,-25,70,-28,77,-31,84,-34,91,-37,97,-40,104,-44,110,-48,117,-52,123,-56,128,-61,134,-66,139,-72,144,-77,150,-83,155,-88,160,-93,166,-99,171,-104,176,-109,182,-114,188,-119,194,-124,200,-128,206,-132,212,-137,219,-140,225,-144,232,-147,239,-150,246,-152,253,-155,260,-158,267,-160,274,-163],
    [0,0,-42,15,-83,32,-126,41,-170,35,-213,27,-257,21,-301,16,-345,13,-390,11,-434,11,-478,13,-522,16,-567,21,-610,27,-654,35,-697,44,-740,55,-783,67,-825,81,-867,96,-908,113,-948,132,-988,151,-1027,172,-1065,195,-1102,219,-1139,244,-1174,271,-1208,299,-1241,329,-1273,360,-1304,392,-1333,425,-1361,459,-1388,495,-1413,531,-1436,569,-1458,608,-1478,647,-1500,686,-1521,724,-1542,763,-1564,802],
    [0,0,-28,8,-55,18,-82,27,-110,34,-139,36,-167,32,-196,29,-225,27,-254,25,-282,24,-311,24,-340,25,-369,26,-398,30,-426,34,-454,39,-482,46,-510,54,-537,63,-564,74,-590,87,-615,101,-640,116,-664,132,-687,149,-710,167,-732,185,-754,204,-775,223,-797,242,-818,262,-839,282,-861,301,-882,320,-904,339,-926,357,-949,375,-972,392,-995,409,-1019,426,-1042,443,-1065,460,-1089,477],
  ];
  const SEG = STRANDS[0].length / 2 - 1;

  // A thread is a chain of short links simulated as a rope in a room with
  // no gravity: it keeps its length, carries no weight, and only moves
  // because its ends move or because it was already moving. Carry a
  // picture off and the links nearest it follow first, the rest catching
  // up along the chain; push it toward the knot and the slack bows out.
  // The thread's one memory is the drawn strand: a faint pull back toward
  // that curve, so a thread left alone settles into the drawing again.
  const GLIDE = 0.93;     // velocity kept per step: the thickness of the air
  const ITERS = 10;       // passes over the links per step
  const BEND = 0.08;      // how firmly a link resists being kinked
  const MEMORY = 1.6;     // pull toward the drawn curve (1/s)
  const REEL = 4.5;       // how fast thread is paid out or taken in (1/s)
  const FIXED = 1 / 120;  // physics runs on a fixed step, whatever the frame rate

  function makeRope() {
    const pts = [];
    for (let k = 0; k <= SEG; k++) pts.push({ x: 0, y: 0, px: 0, py: 0, rx: 0, ry: 0 });
    return { pts, len: 0, rest: 0, want: 0 };
  }

  // The drawn strand, carried to wherever its picture is: one similarity
  // turns and scales the drawing by exactly the amount that puts the drawn
  // tip on the picture, so the curve remembered is the curve as drawn.
  function setRest(rope, c, a, hx, hy) {
    const m = c.mapped, n = SEG + 1, pts = rope.pts;
    const ux = m[2 * SEG], uy = m[2 * SEG + 1];
    const vx = a.x - hx, vy = a.y - hy;
    const d = ux * ux + uy * uy || 1;
    const sr = (vx * ux + vy * uy) / d;
    const si = (vy * ux - vx * uy) / d;
    let L = 0;
    for (let k = 0; k < n; k++) {
      const px = m[2 * k], py = m[2 * k + 1];
      const x = hx + sr * px - si * py;
      const y = hy + si * px + sr * py;
      if (k) L += Math.hypot(x - pts[k - 1].rx, y - pts[k - 1].ry);
      pts[k].rx = x; pts[k].ry = y;
    }
    rope.want = L;
  }

  function snapRope(rope) {
    for (const p of rope.pts) { p.x = p.px = p.rx; p.y = p.py = p.ry; }
    rope.rest = rope.len = rope.want;
  }

  function stepRope(rope, dt) {
    const pts = rope.pts, n = pts.length;
    rope.rest += (rope.want - rope.rest) * (1 - Math.exp(-REEL * dt));
    const mem = 1 - Math.exp(-MEMORY * dt);

    for (let k = 1; k < n - 1; k++) {
      const p = pts[k];
      const vx = (p.x - p.px) * GLIDE;
      const vy = (p.y - p.py) * GLIDE;
      p.px = p.x; p.py = p.y;
      p.x += vx + (p.rx - p.x) * mem;
      p.y += vy + (p.ry - p.y) * mem;
    }
    // the ends are tied: the knot behind her head, and the picture
    const e0 = pts[0], e1 = pts[n - 1];
    e0.x = e0.px = e0.rx; e0.y = e0.py = e0.ry;
    e1.x = e1.px = e1.rx; e1.y = e1.py = e1.ry;

    const link = rope.rest / (n - 1);
    for (let it = 0; it < ITERS; it++) {
      // every link keeps its length; a thread pulled past its length is
      // simply a straight one
      for (let k = 0; k < n - 1; k++) {
        const a = pts[k], b = pts[k + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1e-6;
        const f = (d - link) / d;
        if (k === 0) { b.x -= dx * f; b.y -= dy * f; }
        else if (k + 1 === n - 1) { a.x += dx * f; a.y += dy * f; }
        else {
          a.x += dx * f * 0.5; a.y += dy * f * 0.5;
          b.x -= dx * f * 0.5; b.y -= dy * f * 0.5;
        }
      }
      // and resists being kinked, with the drawn bend as its natural one
      for (let k = 1; k < n - 1; k++) {
        const a = pts[k - 1], p = pts[k], b = pts[k + 1];
        const mx = (a.x + b.x - a.rx - b.rx) / 2 + p.rx;
        const my = (a.y + b.y - a.ry - b.ry) / 2 + p.ry;
        p.x += (mx - p.x) * BEND;
        p.y += (my - p.y) * BEND;
      }
    }

    let L = 0;
    for (let k = 0; k < n - 1; k++) L += Math.hypot(pts[k + 1].x - pts[k].x, pts[k + 1].y - pts[k].y);
    rope.len = L;
  }

  function drawRope(rope) {
    const p = rope.pts, n = p.length;
    // A thread thins a touch as it is drawn out, the way a filament does.
    const stretch = Math.min(Math.max(rope.len / (rope.rest || 1), 1), 1.7);

    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y);
    for (let k = 1; k < n - 1; k++) {
      ctx.quadraticCurveTo(p[k].x, p[k].y, (p[k].x + p[k + 1].x) / 2, (p[k].y + p[k + 1].y) / 2);
    }
    ctx.lineTo(p[n - 1].x, p[n - 1].y);
    // Compensate part of the zoom so a pulled-back thread stays readable.
    ctx.lineWidth = 1.55 / (stretch * Math.pow(zoom, 0.55));
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = THREAD;
    ctx.globalAlpha = 1 - (stretch - 1) * 0.25;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Where the thread ends: the middle of the picture, under the card, so
  // it runs straight in from whichever side it arrives and is cut off by
  // the picture's edge, never bent around it.
  function anchorOf(c, ox, oy) {
    const ry = (c.w / c.item.ar - c.h) / 2 * c.sc;    // picture centre, above the caption
    const r = c.rot * Math.PI / 180;
    return { x: c.x + ox - ry * Math.sin(r), y: c.y + oy + ry * Math.cos(r) };
  }


  // --------------------------------------------------------------- layout
  // snap places the cards outright; without it they keep their current
  // position and glide to the new one, so a resize never cuts an entrance
  // short or teleports a picture out from under the pointer.
  function layout(snap) {
    W = innerWidth; H = innerHeight;
    DPR = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    narrow = W <= 860;

    const gr = girl.getBoundingClientRect();
    // girl.png sits inside the scaled world, so undo the scale to read
    // the knot back in world coordinates.
    head = {
      x: toWorldX(gr.left + gr.width * HEAD.x),
      y: toWorldY(gr.top + gr.height * HEAD.y),
    };

    girlBox = {
      x0: toWorldX(gr.left) - 8, x1: toWorldX(gr.right) + 8,
      y0: toWorldY(gr.top) - 8, y1: toWorldY(gr.bottom),
    };

    if (narrow) packNarrow(toWorldY(gr.top)); else placeWide();

    for (const c of cards) {
      if (!c.rope) c.rope = makeRope();
      const b = bounds(c);
      c.homeX = Math.min(Math.max(c.homeX, b.minX), b.maxX);
      c.homeY = Math.min(Math.max(c.homeY, b.minY), b.maxY);
      if (c.settleAt || c.dragging) continue;   // an entrance or a drag owns the target
      c.tx = c.homeX; c.ty = c.homeY;
      if (!snap) continue;
      c.x = c.tx; c.y = c.ty;
      c.vx = c.vy = 0;
      setRest(c.rope, c, anchorOf(c, 0, 0), head.x, head.y);
      snapRope(c.rope);
    }
  }

  // How far a card may travel: the visible world, which grows as you pull
  // back, so zooming out really does give more room to move things.
  function bounds(c) {
    const halfW = W / (2 * zoom);
    const mx = c.w / 2 + 6, my = c.h / 2 + 6;
    const left = W / 2 - halfW, right = W / 2 + halfW;
    const top = H - H / zoom, bottom = H;
    return {
      minX: left + mx, maxX: Math.max(left + mx, right - mx),
      minY: top + my, maxY: Math.max(top + my, bottom - my),
    };
  }

  function measure() {
    for (const c of cards) {
      const r = c.el.getBoundingClientRect();
      c.w = r.width / zoom; c.h = r.height / zoom;
    }
  }

  // Give each card the strand it hangs off, scaled into the page. The
  // similarity in setRest divides the scale out again, so only the shape
  // of what is stored here matters, never its size.
  function mapStrand(c, sx, sy) {
    const s = STRANDS[c.item.strand];
    const m = new Float64Array(s.length);
    for (let k = 0; k < s.length; k += 2) { m[k] = s[k] * sx; m[k + 1] = s[k + 1] * sy; }
    c.mapped = m;
  }

  function placeWide() {
    for (const c of cards) {
      c.el.style.width = Math.round(Math.min(Math.max(c.item.wide.w * W, 88), 250)) + 'px';
    }
    measure();

    // The drawing is pinned at the knot and grown until the first picture
    // would be pushed off an edge. Across and down are fitted separately,
    // since a page is rarely the shape the drawing was made on.
    const PAD = 10;
    let sx = Infinity, sy = Infinity;
    for (const c of cards) {
      const s = STRANDS[c.item.strand];
      const tx = s[s.length - 2], ty = s[s.length - 1];
      const hw = c.w / 2 + PAD, hh = c.h / 2 + PAD;
      if (tx < 0) sx = Math.min(sx, (head.x - hw) / -tx);
      else if (tx > 0) sx = Math.min(sx, (W - head.x - hw) / tx);
      if (ty < 0) sy = Math.min(sy, (head.y - hh) / -ty);
      else if (ty > 0) sy = Math.min(sy, (H - head.y - hh) / ty);
    }
    sx = Math.max(sx, 0.02); sy = Math.max(sy, 0.02);
    const R = 1.55;                      // how far out of proportion it may go
    if (sx > sy * R) sx = sy * R; else if (sy > sx * R) sy = sx * R;

    for (const c of cards) {
      mapStrand(c, sx, sy);
      const s = STRANDS[c.item.strand];
      c.homeX = c.fx != null ? c.fx * W : head.x + s[s.length - 2] * sx;
      c.homeY = c.fy != null ? c.fy * H : head.y + s[s.length - 1] * sy - (c.w / c.item.ar - c.h) / 2;
    }
    relax();
  }

  // The collage is laid out close-packed, which only fits on a screen of
  // roughly the shape it was drawn for. On a shorter or narrower one the
  // pictures would run into each other, so any pair that does is eased
  // apart along whichever axis needs the least movement. Nothing shifts
  // at all on a screen where the layout already fits.
  function relax() {
    const PAD = 9;
    for (let pass = 0; pass < 30; pass++) {
      let moved = 0;
      for (let i = 0; i < cards.length; i++) {
        for (let j = i + 1; j < cards.length; j++) {
          const a = cards[i], b = cards[j];
          const ox = (a.w + b.w) / 2 + PAD - Math.abs(a.homeX - b.homeX);
          const oy = (a.h + b.h) / 2 + PAD - Math.abs(a.homeY - b.homeY);
          if (ox <= 0 || oy <= 0) continue;
          if (oy < ox) {
            const s = (a.homeY < b.homeY ? -1 : 1) * oy * 0.5;
            a.homeY += s; b.homeY -= s;
          } else {
            const s = (a.homeX < b.homeX ? -1 : 1) * ox * 0.5;
            a.homeX += s; b.homeX -= s;
          }
          moved++;
        }
      }
      // the corner buttons are not part of the collage: lift anything off them
      const cr = controls.getBoundingClientRect();
      const bx0 = toWorldX(cr.left) - 10, bx1 = toWorldX(cr.right) + 10;
      const by0 = toWorldY(cr.top) - 10, by1 = toWorldY(cr.bottom) + 10;
      for (const c of cards) {
        const ox = Math.min(c.homeX + c.w / 2, bx1) - Math.max(c.homeX - c.w / 2, bx0);
        const oy = Math.min(c.homeY + c.h / 2, by1) - Math.max(c.homeY - c.h / 2, by0);
        if (ox > 0 && oy > 0) { c.homeY -= oy; moved++; }
      }
      // and nothing sits on her: a picture over the girl is slid off
      // sideways, or lifted, whichever is the shorter way out
      for (const c of cards) {
        const ox = Math.min(c.homeX + c.w / 2, girlBox.x1) - Math.max(c.homeX - c.w / 2, girlBox.x0);
        const oy = Math.min(c.homeY + c.h / 2, girlBox.y1) - Math.max(c.homeY - c.h / 2, girlBox.y0);
        if (ox <= 0 || oy <= 0) continue;
        const gx = (girlBox.x0 + girlBox.x1) / 2;
        const sideways = c.homeX < gx ? -(c.homeX + c.w / 2 - girlBox.x0) : girlBox.x1 - (c.homeX - c.w / 2);
        if (Math.abs(sideways) < oy) c.homeX += sideways; else c.homeY -= oy;
        moved++;
      }
      for (const c of cards) {
        const bd = bounds(c);
        c.homeX = Math.min(Math.max(c.homeX, bd.minX), bd.maxX);
        c.homeY = Math.min(Math.max(c.homeY, bd.minY), bd.maxY);
      }
      if (!moved) break;
    }
  }

  // On a narrow screen the cards stack above the girl in four rows. Row
  // heights are measured rather than assumed, and the whole block shrinks
  // until it fits the space above her head, so nothing ever collides.
  function packNarrow(girlTop) {
    const ROWS = 4, GAP = Math.max(8, H * 0.012);
    const top = H * 0.018;
    const avail = Math.max(120, girlTop - top - H * 0.02);
    let rowH = [];

    let scale = 1;
    for (let pass = 0; pass < 9; pass++) {
      for (const c of cards) {
        c.el.style.width =
          Math.round(Math.min(Math.max(c.item.narrow.w * W * scale, 52), W * 0.34)) + 'px';
      }
      measure();
      rowH = new Array(ROWS).fill(0);
      for (const c of cards) rowH[c.item.narrow.row] = Math.max(rowH[c.item.narrow.row], c.h);
      const total = rowH.reduce((a, b) => a + b, 0) + GAP * (ROWS - 1);
      if (total <= avail || scale < 0.45) break;
      scale *= Math.max(0.86, avail / total);
    }

    const rowY = [];
    let y = top;
    for (let r = 0; r < ROWS; r++) { rowY[r] = y + rowH[r] / 2; y += rowH[r] + GAP; }

    for (const c of cards) {
      mapStrand(c, 1, 1);
      if (c.fx != null) { c.homeX = c.fx * W; c.homeY = c.fy * H; continue; }
      c.homeX = c.item.narrow.x * W;
      c.homeY = rowY[c.item.narrow.row];
    }
  }

  // ---------------------------------------------------------------- entry
  // Everything arrives stacked in the middle and is drawn out to its place,
  // one after another, as though the threads reeled them in.
  const SETTLE_DELAY = 260, SETTLE_STAGGER = 62;

  function gatherToCentre(now) {
    for (const c of cards) {
      c.x = W / 2 + Math.cos(c.phase) * 14;
      c.y = H / 2 + Math.sin(c.phase) * 11;
      c.tx = c.x; c.ty = c.y;
      c.vx = c.vy = 0;
      c.rot = 0;
      c.sc = 0.86;
      c.settleAt = now + SETTLE_DELAY + c.i * SETTLE_STAGGER;
      setRest(c.rope, c, anchorOf(c, 0, 0), head.x, head.y);
      snapRope(c.rope);
    }
  }

  function resetAll() {
    setZoom(1);
    for (const c of cards) { c.fx = c.fy = null; c.el.style.zIndex = ''; c.settleAt = 0; }
    topZ = 10;
    layout(false);
    gatherToCentre(performance.now());
  }

  // ---------------------------------------------------------- interaction
  // A press has to travel this far before it counts as dragging rather
  // than as a click opening the article. Set wide, so a small waver of
  // the hand is read as holding still, not as the start of a drag.
  const DRAG_SLOP = 15;

  for (const c of cards) {
    const el = c.el;
    el.addEventListener('dragstart', e => e.preventDefault());

    el.addEventListener('pointerdown', e => {
      if (e.button !== undefined && e.button !== 0) return;
      if (pinch.active) return;
      c.dragging = true;
      c.pointerId = e.pointerId;
      c.grabDX = c.x - toWorldX(e.clientX);
      c.grabDY = c.y - toWorldY(e.clientY);
      c.downX = e.clientX; c.downY = e.clientY; c.downT = performance.now();
      c.moved = false;
      c.settleAt = 0;
      el.classList.add('dragging');
      el.style.zIndex = String(++topZ);
      c.link.setPointerCapture(e.pointerId);
    });

    el.addEventListener('pointermove', e => {
      if (!c.dragging || e.pointerId !== c.pointerId) return;
      if (!c.moved && Math.hypot(e.clientX - c.downX, e.clientY - c.downY) > DRAG_SLOP) c.moved = true;
      c.tx = toWorldX(e.clientX) + c.grabDX;
      c.ty = toWorldY(e.clientY) + c.grabDY;
    });

    const release = e => {
      if (!c.dragging || e.pointerId !== c.pointerId) return;
      c.dragging = false;
      c.pointerId = null;
      el.classList.remove('dragging');
      const b = bounds(c);
      c.tx = Math.min(Math.max(c.tx, b.minX), b.maxX);
      c.ty = Math.min(Math.max(c.ty, b.minY), b.maxY);
      c.homeX = c.tx; c.homeY = c.ty;
      c.fx = c.tx / W; c.fy = c.ty / H;
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);

    // A press that never travelled is a click, and opens the article.
    c.link.addEventListener('click', e => {
      if (c.moved || performance.now() - c.downT > 700) e.preventDefault();
    });
  }

  document.getElementById('zoomOut').addEventListener('click', () => setZoom(zoom - 0.12));
  document.getElementById('zoomIn').addEventListener('click', () => setZoom(zoom + 0.12));
  document.getElementById('reset').addEventListener('click', resetAll);

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    setZoom(zoom * (e.deltaY > 0 ? 0.94 : 1.064));
  }, { passive: false });

  // pinch to zoom
  const pinch = { active: false, ids: [], start: 0, base: 1, pts: new Map() };
  stage.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    pinch.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch.pts.size === 2) {
      const [a, b] = [...pinch.pts.values()];
      pinch.active = true;
      pinch.start = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      pinch.base = zoom;
      for (const c of cards) { c.dragging = false; c.el.classList.remove('dragging'); }
    }
  }, true);
  stage.addEventListener('pointermove', e => {
    if (!pinch.pts.has(e.pointerId)) return;
    pinch.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!pinch.active || pinch.pts.size < 2) return;
    const [a, b] = [...pinch.pts.values()];
    setZoom(pinch.base * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.start));
  }, true);
  const endPinch = e => {
    pinch.pts.delete(e.pointerId);
    if (pinch.pts.size < 2) pinch.active = false;
  };
  stage.addEventListener('pointerup', endPinch, true);
  stage.addEventListener('pointercancel', endPinch, true);

  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '-' || e.key === '_') { setZoom(zoom - 0.12); e.preventDefault(); }
    else if (e.key === '+' || e.key === '=') { setZoom(zoom + 0.12); e.preventDefault(); }
    else if (e.key === '0' || e.key.toLowerCase() === 'r') { resetAll(); e.preventDefault(); }
  });

  // ----------------------------------------------------------- simulation
  // A slack spring: the picture trails the hand instead of snapping to it.
  const STIFF = 155, DAMP = 20;
  let last = performance.now(), acc = 0, t = 0;

  // Cards and ropes advance together on a fixed step, so a rope behaves
  // the same on a 60Hz screen as on a 144Hz one.
  function simulate(dt, now) {
    t += dt;
    for (const c of cards) {
      if (c.settleAt && now >= c.settleAt) { c.tx = c.homeX; c.ty = c.homeY; c.settleAt = 0; }

      const ax = (c.tx - c.x) * STIFF - c.vx * DAMP;
      const ay = (c.ty - c.y) * STIFF - c.vy * DAMP;
      c.vx += ax * dt; c.vy += ay * dt;
      c.x += c.vx * dt; c.y += c.vy * dt;
      c.sc += (1 - c.sc) * Math.min(1, dt * 7);

      const lean = Math.max(-6, Math.min(6, c.vx * 0.008));
      c.rot += (lean - c.rot) * Math.min(1, dt * 8);

      // A breath, small enough that nothing reads as jitter.
      c.ox = reduceMotion ? 0 : Math.cos(t * 0.31 + c.phase) * 0.9;
      c.oy = reduceMotion ? 0 : Math.sin(t * 0.44 + c.phase) * 1.3;

      setRest(c.rope, c, anchorOf(c, c.ox, c.oy), head.x, head.y);
      stepRope(c.rope, dt);
    }
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.2);
    last = now;
    acc = Math.min(acc + dt, 0.25);
    let steps = 0;
    while (acc >= FIXED && steps < 12) { acc -= FIXED; steps++; simulate(FIXED, now); }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(DPR * zoom, 0, 0, DPR * zoom,
                     DPR * (W / 2) * (1 - zoom), DPR * H * (1 - zoom));

    for (const c of cards) {
      c.el.style.transform =
        'translate(' + (c.x + c.ox - c.w / 2).toFixed(2) + 'px,' +
                       (c.y + c.oy - c.h / 2).toFixed(2) + 'px) rotate(' +
                       c.rot.toFixed(2) + 'deg) scale(' + c.sc.toFixed(3) + ')';
      drawRope(c.rope);
    }

    requestAnimationFrame(frame);
  }

  // ----------------------------------------------------------------- boot
  let resizeTimer = null;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => layout(false), 120);
  });

  const imgs = [girl, ...cards.map(c => c.el.querySelector('img'))];
  Promise.all(imgs.map(im => im.complete ? null : new Promise(r => { im.onload = r; im.onerror = r; })))
    .then(() => {
      applyZoom();
      layout(true);
      gatherToCentre(performance.now());
      requestAnimationFrame(now => { last = now; acc = 0; frame(now); });
    });
})();
</script>
</body>
</html>
