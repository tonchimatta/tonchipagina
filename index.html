<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonchi</title>
<style>
  :root {
    --thread: #e03127;
    --ink: #1f1f1f;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }
  #threads {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  #girl {
    position: absolute;
    z-index: 2;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    height: min(72vh, 640px);
    width: auto;
    right: 12vw;
    bottom: 0;
  }
  .card {
    position: absolute;
    left: 0; top: 0;
    margin: 0;
    z-index: 3;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
  }
  .card.dragging { cursor: grabbing; }
  .card a { display: block; color: inherit; text-decoration: none; outline: none; }
  .card a:focus-visible img { outline: 2px solid var(--thread); outline-offset: 3px; }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    -webkit-user-drag: none;
    pointer-events: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.07), 0 5px 16px rgba(0,0,0,.09);
    transition: box-shadow .3s ease;
  }
  .card.dragging img { box-shadow: 0 2px 5px rgba(0,0,0,.10), 0 18px 36px rgba(0,0,0,.20); }
  .card figcaption {
    margin: .4em 0 0;
    font-size: clamp(9.5px, .72vw, 12px);
    line-height: 1.32;
    letter-spacing: .005em;
    color: #3a3a3a;
  }
  @media (max-width: 860px) {
    #girl { height: 34vh; right: 50%; transform: translateX(50%); }
    .card figcaption { font-size: 9.5px; line-height: 1.28; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="threads"></canvas>
  <img id="girl" src="girl.png" alt="" draggable="false">
</div>

<script>
(() => {
  // ---------------------------------------------------------------- data
  // ar = image aspect ratio (w/h). w = card width as a fraction of the
  // viewport width. pos = card centre as a fraction of the viewport.
  const ITEMS = [
    { text: 'Soberana Orden Militar de Malta.', href: 'https://es.wikipedia.org/wiki/Orden_de_Malta',
      src: 'img/2001.jpg', ar: 900/600,
      wide: { w: 0.150, pos: [0.108, 0.135] }, narrow: { w: 0.280, x: 0.180, row: 0 } },

    { text: 'Caso de las salchichas (1522).', href: 'https://es.wikipedia.org/wiki/Caso_de_las_salchichas',
      src: 'img/2003.jpg', ar: 900/675,
      wide: { w: 0.120, pos: [0.298, 0.115] }, narrow: { w: 0.260, x: 0.500, row: 0 } },

    { text: 'Architecture terrible.', href: 'https://en.wikipedia.org/wiki/Architecture_terrible',
      src: 'img/2006.jpg', ar: 900/600,
      wide: { w: 0.145, pos: [0.480, 0.120] }, narrow: { w: 0.280, x: 0.820, row: 0 } },

    { text: 'Hegéloco.', href: 'https://es.wikipedia.org/wiki/Heg%C3%A9loco',
      src: 'img/2011.jpg', ar: 890/900,
      wide: { w: 0.098, pos: [0.655, 0.130] }, narrow: { w: 0.240, x: 0.165, row: 1 } },

    { text: 'Large numbers.', href: 'https://en.wikipedia.org/wiki/Large_numbers',
      src: 'img/2015.jpg', ar: 900/854,
      wide: { w: 0.120, pos: [0.240, 0.385] }, narrow: { w: 0.250, x: 0.500, row: 1 } },

    { text: 'Criterion of embarrassment.', href: 'https://en.wikipedia.org/wiki/Criterion_of_embarrassment',
      src: 'img/2020.jpg', ar: 733/900,
      wide: { w: 0.102, pos: [0.430, 0.380] }, narrow: { w: 0.220, x: 0.430, row: 2 } },

    { text: 'Tablilla de quejas a Ea-nasir.', href: 'https://es.wikipedia.org/wiki/Tablilla_de_Ea-nasir',
      src: 'img/2024.jpg', ar: 511/900,
      wide: { w: 0.074, pos: [0.055, 0.545] }, narrow: { w: 0.160, x: 0.115, row: 2 } },

    { text: 'Unst Bus Shelter.', href: 'https://en.wikipedia.org/wiki/Unst_Bus_Shelter',
      src: 'img/2026.jpg', ar: 900/607,
      wide: { w: 0.135, pos: [0.415, 0.760] }, narrow: { w: 0.260, x: 0.500, row: 3 } },

    { text: 'Papa Benedicto IX.', href: 'https://es.wikipedia.org/wiki/Benedicto_IX',
      src: 'img/2028.jpg', ar: 1,
      wide: { w: 0.118, pos: [0.190, 0.730] }, narrow: { w: 0.240, x: 0.785, row: 2 } },

    { text: 'Osama bin Laden', href: 'https://es.wikipedia.org/wiki/Osama_bin_Laden_(elefante)',
      src: 'img/2030.jpg', ar: 900/700,
      wide: { w: 0.102, pos: [0.925, 0.180] }, narrow: { w: 0.260, x: 0.835, row: 1 } },
  ];

  // Where the threads are knotted, as a fraction of girl.png (crown of the head).
  const HEAD = { x: 235 / 385, y: 17 / 599 };

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const THREAD = getComputedStyle(document.documentElement).getPropertyValue('--thread').trim() || '#e03127';

  // ---------------------------------------------------------------- dom
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('threads');
  const ctx = canvas.getContext('2d');
  const girl = document.getElementById('girl');

  let W = 0, H = 0, DPR = 1, narrow = false;
  let head = { x: 0, y: 0 };
  let topZ = 10;

  const cards = ITEMS.map((item, i) => {
    const fig = document.createElement('figure');
    fig.className = 'card';
    fig.innerHTML =
      '<a href="' + item.href + '" target="_blank" rel="noopener noreferrer" draggable="false">' +
        '<img src="' + item.src + '" alt="' + item.text + '" draggable="false" ' +
             'style="aspect-ratio:' + item.ar + '">' +
        '<figcaption>' + item.text + '</figcaption>' +
      '</a>';
    stage.appendChild(fig);
    return {
      item, i, el: fig, link: fig.querySelector('a'),
      x: 0, y: 0, vx: 0, vy: 0,      // centre and velocity, px
      tx: 0, ty: 0,                   // spring target
      rot: 0, w: 0, h: 0,
      phase: (i * 2.399) % (Math.PI * 2),
      dragging: false, pointerId: null,
      grabDX: 0, grabDY: 0,
      downX: 0, downY: 0, downT: 0, moved: false,
      fx: null, fy: null,             // position the visitor chose
      rope: null,
    };
  });

  // ------------------------------------------------------------- threads
  // The thread has no weight of its own. It is held up by a rest shape:
  // a cubic bezier that leaves the crown almost vertically, so every
  // thread bundles at the knot before splaying out to its card. Each
  // point chases its place on that curve through a viscous lag, which is
  // what makes the thread flow and trail when a card is pulled away and
  // then gather itself back into the arc.
  const SEG = 26;
  const LAG = 7.2;        // how fast a point catches up to the rest shape (1/s)
  const GLIDE = 0.90;     // velocity retained per step: the viscosity
  const EVEN_ITERS = 2;   // constraint passes that keep the spacing even
  const EVEN_FORCE = 0.12;

  function makeRope() {
    const pts = [];
    for (let k = 0; k <= SEG; k++) pts.push({ x: 0, y: 0, px: 0, py: 0, rx: 0, ry: 0 });
    return { pts, len: 0 };
  }

  // Rest shape control points. a is the card anchor (with the outward
  // normal of the edge it is tied to), hx/hy the knot on the head.
  function restShape(a, hx, hy, wob) {
    let dx = a.x - hx, dy = a.y - hy;
    const L = Math.hypot(dx, dy) || 1;
    dx /= L; dy /= L;

    // Leaving the knot: mostly straight up, leaned toward the card's side.
    // The strong upward term is what ties every thread into one bundle.
    let bx = dx, by = dy - 1.15;
    const bl = Math.hypot(bx, by) || 1;
    bx /= bl; by /= bl;

    // Leaving the card: out along the edge's normal, already bending back
    // toward the knot, so the thread meets the picture square on instead
    // of running flat across the row.
    let ex = a.nx + (-dx) * 1.1, ey = a.ny + (-dy) * 1.1;
    const el = Math.hypot(ex, ey) || 1;
    ex /= el; ey /= el;
    const out = Math.min(L * 0.22, 180);

    return {
      p0x: hx, p0y: hy,
      p1x: hx + bx * L * 0.36, p1y: hy + by * L * 0.36 + wob * Math.min(1, L / 420),
      p2x: a.x + ex * out, p2y: a.y + ey * out - wob * (out / 180),
      p3x: a.x, p3y: a.y,
    };
  }

  function bezier(s, t, out) {
    const u = 1 - t;
    const a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
    out.x = a * s.p0x + b * s.p1x + c * s.p2x + d * s.p3x;
    out.y = a * s.p0y + b * s.p1y + c * s.p2y + d * s.p3y;
  }

  const tmp = { x: 0, y: 0 };

  // The rest points are spread by arc length, not by the curve's own
  // parameter. Spacing them evenly is what keeps the thread from rippling
  // where the arc turns tightest.
  const SAMP = 72;
  const sxs = new Float64Array(SAMP + 1);
  const sys = new Float64Array(SAMP + 1);
  const sls = new Float64Array(SAMP + 1);

  function setRest(rope, a, hx, hy, wob) {
    const s = restShape(a, hx, hy, wob);
    const pts = rope.pts;

    let total = 0;
    for (let k = 0; k <= SAMP; k++) {
      bezier(s, k / SAMP, tmp);
      if (k) total += Math.hypot(tmp.x - sxs[k - 1], tmp.y - sys[k - 1]);
      sxs[k] = tmp.x; sys[k] = tmp.y; sls[k] = total;
    }

    let j = 0;
    for (let i = 0; i <= SEG; i++) {
      const want = total * i / SEG;
      while (j < SAMP - 1 && sls[j + 1] < want) j++;
      const span = sls[j + 1] - sls[j];
      const f = span > 1e-6 ? (want - sls[j]) / span : 0;
      pts[i].rx = sxs[j] + (sxs[j + 1] - sxs[j]) * f;
      pts[i].ry = sys[j] + (sys[j + 1] - sys[j]) * f;
    }
  }

  function snapRope(rope) {
    for (const p of rope.pts) { p.x = p.px = p.rx; p.y = p.py = p.ry; }
  }

  function stepRope(rope, dt) {
    const pts = rope.pts, n = pts.length;
    const catchUp = 1 - Math.exp(-LAG * dt);

    for (let k = 1; k < n - 1; k++) {
      const p = pts[k];
      const vx = (p.x - p.px) * GLIDE;
      const vy = (p.y - p.py) * GLIDE;
      p.px = p.x; p.py = p.y;
      p.x += vx + (p.rx - p.x) * catchUp;
      p.y += vy + (p.ry - p.y) * catchUp;
    }
    // the ends are pinned: the knot and the card anchor
    pts[0].x = pts[0].rx; pts[0].y = pts[0].ry;
    pts[n - 1].x = pts[n - 1].rx; pts[n - 1].y = pts[n - 1].ry;

    // Even out the spacing so the thread reads as one continuous filament
    // instead of bunching where it turns.
    let target = 0;
    for (let k = 0; k < n - 1; k++) target += Math.hypot(pts[k + 1].rx - pts[k].rx, pts[k + 1].ry - pts[k].ry);
    target /= (n - 1);

    for (let it = 0; it < EVEN_ITERS; it++) {
      for (let k = 0; k < n - 1; k++) {
        const a = pts[k], b = pts[k + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1e-4;
        const f = ((d - target) / d) * EVEN_FORCE;
        const ox = dx * f, oy = dy * f;
        if (k !== 0) { a.x += ox; a.y += oy; }
        if (k + 1 !== n - 1) { b.x -= ox; b.y -= oy; }
      }
    }

    let L = 0;
    for (let k = 0; k < n - 1; k++) L += Math.hypot(pts[k + 1].x - pts[k].x, pts[k + 1].y - pts[k].y);
    rope.len = L;
  }

  function drawRope(rope) {
    const p = rope.pts, n = p.length;
    // A thread thins a touch as it is drawn out, the way a filament does.
    let rest = 0;
    for (let k = 0; k < n - 1; k++) rest += Math.hypot(p[k + 1].rx - p[k].rx, p[k + 1].ry - p[k].ry);
    const stretch = Math.min(Math.max(rope.len / (rest || 1), 1), 1.7);

    ctx.beginPath();
    ctx.moveTo(p[0].x, p[0].y);
    for (let k = 1; k < n - 1; k++) {
      ctx.quadraticCurveTo(p[k].x, p[k].y, (p[k].x + p[k + 1].x) / 2, (p[k].y + p[k + 1].y) / 2);
    }
    ctx.lineTo(p[n - 1].x, p[n - 1].y);
    ctx.lineWidth = 1.55 / stretch;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = THREAD;
    ctx.globalAlpha = 1 - (stretch - 1) * 0.25;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Where the thread is taped to the picture. A card above the knot is
  // tied along its bottom edge and one below it along its top, so the
  // thread rises into it; only a card level with the head is tied on the
  // side. SIDE_BIAS sets how far off to the side that has to be.
  const SIDE_BIAS = 4.5;
  function anchorOf(c, ox, oy) {
    const cx = c.x + ox, cy = c.y + oy;
    const hw = c.w / 2, hh = c.h / 2;
    const dx = head.x - cx, dy = head.y - cy;
    let ax, ay, nx, ny;
    if (Math.abs(dx) * hh > Math.abs(dy) * hw * SIDE_BIAS) {
      nx = Math.sign(dx) || 1; ny = 0;
      ax = cx + nx * hw;
      ay = cy + Math.max(-hh * 0.55, Math.min(hh * 0.55, (dy / Math.abs(dx || 1)) * hw * 0.5));
    } else {
      ny = Math.sign(dy) || 1; nx = 0;
      ay = cy + ny * hh;
      ax = cx + Math.max(-hw * 0.55, Math.min(hw * 0.55, (dx / Math.abs(dy || 1)) * hh * 0.5));
    }
    const r = c.rot * Math.PI / 180, cs = Math.cos(r), sn = Math.sin(r);
    const rx = ax - cx, ry = ay - cy;
    return {
      x: cx + rx * cs - ry * sn, y: cy + rx * sn + ry * cs,
      nx: nx * cs - ny * sn, ny: nx * sn + ny * cs,
    };
  }

  // --------------------------------------------------------------- layout
  function layout() {
    W = innerWidth; H = innerHeight;
    DPR = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    narrow = W <= 860;

    const gr = girl.getBoundingClientRect();
    head = { x: gr.left + gr.width * HEAD.x, y: gr.top + gr.height * HEAD.y };

    if (narrow) packNarrow(gr.top); else placeWide();

    for (const c of cards) {
      const mx = c.w / 2 + 6, my = c.h / 2 + 6;
      c.x = c.tx = Math.min(Math.max(c.tx, mx), Math.max(mx, W - mx));
      c.y = c.ty = Math.min(Math.max(c.ty, my), Math.max(my, H - my));
      c.vx = c.vy = 0;
      if (!c.rope) c.rope = makeRope();
      setRest(c.rope, anchorOf(c, 0, 0), head.x, head.y, 0);
      snapRope(c.rope);
    }
  }

  function measure() {
    for (const c of cards) {
      const r = c.el.getBoundingClientRect();
      c.w = r.width; c.h = r.height;
    }
  }

  function placeWide() {
    for (const c of cards) {
      c.el.style.width = Math.round(Math.min(Math.max(c.item.wide.w * W, 88), 250)) + 'px';
    }
    measure();
    for (const c of cards) {
      c.tx = (c.fx != null ? c.fx : c.item.wide.pos[0]) * W;
      c.ty = (c.fy != null ? c.fy : c.item.wide.pos[1]) * H;
    }
  }

  // On a narrow screen the cards stack above the girl in four rows. Row
  // heights are measured rather than assumed, and the whole block shrinks
  // until it fits the space above her head, so nothing ever collides.
  function packNarrow(girlTop) {
    const ROWS = 4, GAP = Math.max(8, H * 0.012);
    const top = H * 0.018;
    const avail = Math.max(120, girlTop - top - H * 0.02);
    let scale = 1, rowH = [], rowY = [];

    for (let pass = 0; pass < 9; pass++) {
      for (const c of cards) {
        c.el.style.width =
          Math.round(Math.min(Math.max(c.item.narrow.w * W * scale, 52), W * 0.34)) + 'px';
      }
      measure();
      rowH = new Array(ROWS).fill(0);
      for (const c of cards) rowH[c.item.narrow.row] = Math.max(rowH[c.item.narrow.row], c.h);
      const total = rowH.reduce((a, b) => a + b, 0) + GAP * (ROWS - 1);
      if (total <= avail || scale < 0.45) break;
      scale *= Math.max(0.86, avail / total);
    }

    rowY = [];
    let y = top;
    for (let r = 0; r < ROWS; r++) { rowY[r] = y + rowH[r] / 2; y += rowH[r] + GAP; }

    for (const c of cards) {
      if (c.fx != null) { c.tx = c.fx * W; c.ty = c.fy * H; continue; }
      c.tx = c.item.narrow.x * W;
      c.ty = rowY[c.item.narrow.row];
    }
  }

  // ---------------------------------------------------------- interaction
  for (const c of cards) {
    const el = c.el;
    el.addEventListener('dragstart', e => e.preventDefault());

    el.addEventListener('pointerdown', e => {
      if (e.button !== undefined && e.button !== 0) return;
      c.dragging = true;
      c.pointerId = e.pointerId;
      c.grabDX = c.x - e.clientX;
      c.grabDY = c.y - e.clientY;
      c.downX = e.clientX; c.downY = e.clientY; c.downT = performance.now();
      c.moved = false;
      el.classList.add('dragging');
      el.style.zIndex = String(++topZ);
      c.link.setPointerCapture(e.pointerId);
    });

    el.addEventListener('pointermove', e => {
      if (!c.dragging || e.pointerId !== c.pointerId) return;
      if (!c.moved && Math.hypot(e.clientX - c.downX, e.clientY - c.downY) > 6) c.moved = true;
      c.tx = e.clientX + c.grabDX;
      c.ty = e.clientY + c.grabDY;
    });

    const release = e => {
      if (!c.dragging || e.pointerId !== c.pointerId) return;
      c.dragging = false;
      c.pointerId = null;
      el.classList.remove('dragging');
      const mx = c.w / 2 + 8, my = c.h / 2 + 8;
      c.tx = Math.min(Math.max(c.tx, mx), W - mx);
      c.ty = Math.min(Math.max(c.ty, my), H - my);
      c.fx = c.tx / W; c.fy = c.ty / H;
    };
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);

    // A press that never travelled is a click, and opens the article.
    c.link.addEventListener('click', e => {
      if (c.moved || performance.now() - c.downT > 700) e.preventDefault();
    });
  }

  // ----------------------------------------------------------- simulation
  const STIFF = 210, DAMP = 24;   // card spring
  let last = performance.now(), t = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    t += dt;
    ctx.clearRect(0, 0, W, H);

    for (const c of cards) {
      const ax = (c.tx - c.x) * STIFF - c.vx * DAMP;
      const ay = (c.ty - c.y) * STIFF - c.vy * DAMP;
      c.vx += ax * dt; c.vy += ay * dt;
      c.x += c.vx * dt; c.y += c.vy * dt;

      const lean = Math.max(-7, Math.min(7, c.vx * 0.010));
      c.rot += (lean - c.rot) * Math.min(1, dt * 9);

      let ox = 0, oy = 0, wob = 0;
      if (!reduceMotion) {
        ox = Math.cos(t * 0.5 + c.phase) * 1.8;
        oy = Math.sin(t * 0.73 + c.phase) * 2.6;
        wob = Math.sin(t * 0.62 + c.phase * 1.7) * 6.5;   // the arc breathes
      }

      c.el.style.transform =
        'translate(' + (c.x + ox - c.w / 2).toFixed(2) + 'px,' +
                       (c.y + oy - c.h / 2).toFixed(2) + 'px) rotate(' + c.rot.toFixed(2) + 'deg)';

      setRest(c.rope, anchorOf(c, ox, oy), head.x, head.y, wob);
      stepRope(c.rope, dt);
      drawRope(c.rope);
    }

    ctx.beginPath();
    ctx.arc(head.x, head.y, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = THREAD;
    ctx.fill();

    requestAnimationFrame(frame);
  }

  // ----------------------------------------------------------------- boot
  let resizeTimer = null;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 120);
  });

  const imgs = [girl, ...cards.map(c => c.el.querySelector('img'))];
  Promise.all(imgs.map(im => im.complete ? null : new Promise(r => { im.onload = r; im.onerror = r; })))
    .then(() => {
      layout();
      requestAnimationFrame(now => { last = now; frame(now); });
    });
})();
</script>
</body>
</html>
